<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新标签页</title>
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <!-- 背景层（背景图片 / 右键换背景） -->
  <div id="bgLayer" class="bg-layer" aria-hidden="true"></div>

  <!-- 全局错误条（host 未连接等） -->
  <div id="errorBar" class="error-bar" hidden></div>

  <!-- 左栏展开按钮（左栏自动隐藏后用于唤出） -->
  <button id="navToggle" class="nav-toggle" type="button" title="打开/收起导航" aria-label="打开/收起导航">☰</button>

  <div class="layout">
    <!-- 左侧导航栏（默认隐藏，点击按钮唤出；底部为设置入口） -->
    <nav id="sidebar" class="sidebar collapsed" aria-label="页面导航">
      <div class="brand">页签 WebMarker</div>
      <div class="nav-item active" data-view="home" role="button" tabindex="0">主页</div>
      <div class="nav-item" data-view="tags" role="button" tabindex="0">标签墙</div>
      <div class="sidebar-foot">
        <div id="settingsBtn" class="settings-item" role="button" tabindex="0" title="打开管理面板">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>设置</span>
        </div>
      </div>
    </nav>

    <main class="content">
      <!-- ============ 主页视图（网络搜索框 + 匹配窗口，透薄毛玻璃贴合背景） ============ -->
      <div id="viewHome" class="view-home">
        <div class="web-search">
          <span class="drag-handle" title="按住拖动调整位置">
            <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="2" cy="2" r="1.3"/><circle cx="8" cy="2" r="1.3"/><circle cx="2" cy="7" r="1.3"/><circle cx="8" cy="7" r="1.3"/><circle cx="2" cy="12" r="1.3"/><circle cx="8" cy="12" r="1.3"/></svg>
          </span>
          <button id="engineBtn" class="engine-btn" type="button" title="选择搜索引擎">
            <span id="engineBadge" class="engine-badge" style="--e:#2932E1">百</span>
            <span id="engineName">百度</span>
            <span class="engine-caret"><svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <span class="divider"></span>
          <span class="search-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
          <input id="webSearchInput" type="search" placeholder="搜索网络，或输入关键词匹配本地标注…" autocomplete="off" spellcheck="false" />
          <button id="webSearchBtn" class="search-go" type="button" title="搜索">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h9M8.5 4.5L12.5 8l-4 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <!-- 自定义引擎下拉菜单（JS 定位到搜索框下方） -->
        <div id="engineMenu" class="engine-menu" hidden></div>

        <!-- 主页动态本地结果（输入关键词时实时显示标注 + 收藏夹，可点击直达） -->
        <div id="localResults" class="local-results" hidden>
          <div id="localGroups">
            <div class="group-head">标注 <span id="annoCount" class="count-badge" hidden>0</span></div>
            <div id="localAnnotations" class="list"></div>
            <div class="group-head">收藏夹 <span id="bmCount" class="count-badge" hidden>0</span></div>
            <div id="localBookmarks" class="list"></div>
          </div>
          <div id="localEmpty" class="empty-state" hidden>
            <div class="empty-icon"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M6.8 9h4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div>
            <div class="empty-title"></div>
            <div class="empty-sub">试试其它关键词，或按 Enter 直接网络搜索</div>
          </div>
          <div class="panel-foot">
            <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
            <span><kbd>Enter</kbd> 打开</span>
            <span><kbd>Esc</kbd> 收起</span>
            <span class="spacer"></span>
            <span id="footTip">输入为空时自动收起</span>
          </div>
        </div>
      </div>

      <!-- ============ 标签墙视图（可拖动 / 可缩放面板，位置与尺寸记忆） ============ -->
      <div id="viewTags" hidden>
        <section id="tagWallPanel" class="tag-wall-area">
          <div id="tagWallHead" class="tag-wall-head" title="按住拖动移动面板">
            <span class="drag-grip">
              <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="2" cy="2" r="1.3"/><circle cx="8" cy="2" r="1.3"/><circle cx="2" cy="7" r="1.3"/><circle cx="8" cy="7" r="1.3"/><circle cx="2" cy="12" r="1.3"/><circle cx="8" cy="12" r="1.3"/></svg>
            </span>
            <span class="view-title">标签墙</span>
          </div>
          <div id="tagWall" class="tag-wall"></div>
          <span id="tagWallResize" class="resize-handle" title="拖动调整面板大小"></span>
        </section>
      </div>
    </main>
  </div>

  <!-- 右键菜单（背景操作） -->
  <div id="ctxMenu" class="ctx-menu" hidden></div>

  <script src="newtab.js"></script>
</body>
</html>
